name: QA (E2E Playwright)

# Job bloquant depuis le Lot 4B-4 (voir CLAUDE.md section 7 et 13) : la
# suite est restée stable sur 3 exécutions consécutives (desktop + mobile,
# aucune dépendance réseau externe, aucune fixture résiduelle), condition
# posée pour lever le caractère informatif hérité des Lots 4B-1 à 4B-3.
# Distinct de pr-check.yml (build-check), qui reste bloquant et n'est pas
# modifié ici.
#
# Note : ce workflow bloque désormais la fusion via son propre statut de
# check, mais ne devient "required" au sens de la protection de branche
# GitHub que si ce check est ajouté aux règles requises dans les paramètres
# du dépôt (Settings → Branches) — action manuelle hors périmètre du code,
# voir CLAUDE.md section 13.
#
# ACTIONS ÉPINGLÉES PAR SHA (audit sécurité, constat n°4). Chaque `uses:`
# référence un commit précis, pas un tag : un tag - même `v4.3.5` - reste
# déplaçable par le mainteneur de l'action, et une action compromise
# recevrait ici les secrets du workflow. Le commentaire en fin de ligne
# rappelle la version correspondante.
#
# CONTREPARTIE À CONNAÎTRE : un SHA figé ne reçoit plus les correctifs de
# l'action. La mise à jour devient un geste explicite - relever le nouveau
# SHA avec `gh api repos/<depot>/commits/<tag> -q .sha`, jamais recopier
# une valeur vue ailleurs.

on:
  pull_request:
    branches:
      - main

jobs:
  qa-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Installer PHP (Admin-2B, voir docs/VISIBILITE.md)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.0'

      - name: Tests fonctionnels de l'API PHP Visibilité (contre le vrai code PHP, serveur intégré)
        run: npm run visibilites:api-test

      - name: Installer Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Lancer les tests E2E
        run: npm run qa
        env:
          # Valeurs neutres : cette exécution ne sert qu'au contrôle QA,
          # rien n'est déployé nulle part (même logique que pr-check.yml).
          PUBLIC_SITE_URL: "http://localhost:4321"
          PUBLIC_WEB3FORMS_ACCESS_KEY: "check-only"

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
