name: Déployer en production (manuel)

# Déclenchement strictement manuel — tu décides quand la prod
# reçoit ce qui a été validé sur la préprod.
#
# ACTIONS ÉPINGLÉES PAR SHA (audit sécurité, constat n°4). Chaque `uses:`
# référence un commit précis, pas un tag : un tag - même `v4.3.5` - reste
# déplaçable par le mainteneur de l'action, et une action compromise
# recevrait ici les secrets du workflow. Le commentaire en fin de ligne
# rappelle la version correspondante.
#
# CONTREPARTIE À CONNAÎTRE : un SHA figé ne reçoit plus les correctifs de
# l'action. La mise à jour devient un geste explicite - relever le nouveau
# SHA avec `gh api repos/<depot>/commits/<tag> -q .sha`, jamais recopier
# une valeur vue ailleurs.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production   # secrets de l'environnement "production"

    steps:
      - name: Récupérer le code (main)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Installer Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site (build Astro)
        run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          # Pas de PUBLIC_NOINDEX en production : le site doit être indexé.
          # PUBLIC_TALLY_CANDIDATURE_URL volontairement absente ici : le câblage
          # production reste en attente de la validation de la recette Tally en
          # préproduction par Philippe (voir docs/CANDIDATURES_TALLY.md section 7).

      - name: Injecter la configuration Visibilité (Auth + dossier de données) — production
        # Même mécanisme que deploy-preprod.yml (voir ce fichier et
        # docs/VISIBILITE.md section 15.9), avec les valeurs de l'environnement
        # GitHub "production" (Settings → Environments → production → Variables) —
        # jamais les mêmes valeurs que preprod : deux .htpasswd et deux dossiers de
        # données distincts, garantis par cette étape.
        #
        # Les valeurs transitent par `env:` (jamais interpolées directement dans le
        # texte d'un script shell) — scripts/inject-visibilite-config.mjs nettoie tout
        # CR/LF parasite, valide les valeurs puis substitue littéralement, avant de
        # vérifier qu'aucun placeholder ne subsiste dans dist/ (voir
        # scripts/lib/visibilite-deploy-injection.mjs et son test associé).
        run: node scripts/inject-visibilite-config.mjs
        env:
          VISIBILITES_AUTH_USER_FILE: ${{ vars.VISIBILITES_AUTH_USER_FILE }}
          VISIBILITES_DATA_DIR: ${{ vars.VISIBILITES_DATA_DIR }}

      - name: Déployer le contenu de dist/ vers OVH (FTP)
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}/
          dangerous-clean-slate: false
