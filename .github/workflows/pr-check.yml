name: Vérifier le build (avant fusion)

# Se déclenche sur chaque Pull Request vers main.
# N'importe rien nulle part — vérifie seulement que le site compile et que la
# recette automatisée de base (Lot 4B) passe.
on:
  pull_request:
    branches:
      - main

jobs:
  # IMPORTANT (Lot 4B) : ne jamais renommer ce job — la protection de branche
  # sur `main` référence "build-check" par son nom, un renommage casse la
  # fusion des PR (voir docs/RECETTE_AUTOMATISEE.md).
  build-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm ci

      - name: Tests des pipelines de contenu (offres, exposants, programme)
        run: npm run content:test

      - name: Construire le site (contrôle uniquement)
        run: npm run build
        env:
          # Valeurs neutres : ce build ne sert qu'à vérifier que ça compile,
          # il n'est jamais déployé nulle part.
          PUBLIC_SITE_URL: "http://localhost:4321"
          PUBLIC_WEB3FORMS_ACCESS_KEY: "check-only"

      - name: Installer uniquement Chromium pour Playwright
        run: npx playwright install --with-deps chromium

      - name: Recette E2E — smoke test critique (@smoke)
        run: npm run test:e2e:smoke
